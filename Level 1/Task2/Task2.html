<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaScript Tasks</title>
  <link rel="stylesheet" href="Task2.css" />
</head>
<body>
  <h1>JavaScript Tasks</h1>

  <!-- Button Color Change -->
  <div class="task">
    <h2>1. Color Change Button</h2>
    <button id="changeColor" onclick="changeColor()">Click Me!</button>
  </div>

  <!-- Greeting Alert -->
  <div class="task">
    <h2>2. Greeting Based on Time</h2>
    <button onclick="showGreeting()">Show Greeting</button>
  </div>

  <!-- Basic Calculator -->
  <div class="task">
    <h2>3. Simple Calculator</h2>
    <input type="number" id="num1" placeholder="Enter number 1" />
    <input type="number" id="num2" placeholder="Enter number 2" />
    <button onclick="calculateSum()">Add</button>
    <p id="calcResult">Result: </p>
  </div>

  <script src="Task2.js"></script>
</body>
</html>
